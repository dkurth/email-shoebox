<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 20 160 160" width="160" height="160">
  <defs>
    <clipPath id="base"><path d="M32 100h128v50a12 12 0 0 1-12 12H44a12 12 0 0 1-12-12z"/></clipPath>
    <!-- Handle cut-out: a real hole, so the page shows through in light and dark mode -->
    <mask id="handle">
      <rect x="0" y="0" width="192" height="192" fill="#fff"/>
      <rect x="78" y="128" width="36" height="11" rx="5.5" fill="#000"/>
    </mask>
  </defs>
  <!-- Lid, propped open behind the letters -->
  <g transform="rotate(-10 96 60)">
    <rect x="24" y="38" width="144" height="30" rx="8" fill="#DDA66A"/>
    <rect x="24" y="58" width="144" height="10" fill="#B67A42"/>
  </g>
  <!-- Letters standing in the box -->
  <g stroke="#6B4423" stroke-width="3.5" stroke-linejoin="round">
    <g transform="rotate(-6 76 90)">
      <rect x="48" y="68" width="56" height="40" rx="3" fill="#F4E9D8"/>
      <path d="M48 70l28 19 28-19" fill="none"/>
    </g>
    <g transform="rotate(8 126 86)">
      <rect x="98" y="62" width="56" height="40" rx="3" fill="#FFFBF4"/>
      <path d="M98 64l28 19 28-19" fill="none"/>
      <rect x="138" y="68" width="10" height="12" rx="1" fill="#2E7D6B" stroke="none"/>
    </g>
  </g>
  <!-- Box base -->
  <g clip-path="url(#base)" mask="url(#handle)">
    <rect x="32" y="100" width="128" height="62" fill="#C98B4F"/>
    <rect x="32" y="100" width="128" height="10" fill="#9A6234"/>
  </g>
</svg>
